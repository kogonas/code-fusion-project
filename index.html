<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GSU Study Spaces</title>
<style>
:root{--blue:#0039A6;--blue-dark:#002b7d;--blue-soft:#e6edfa;--ink:#1a1f2b;--muted:#5b6475;--line:#d9deea;--bg:#ffffff;--card:#ffffff;--warn:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#1a1f2b}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28'><path d='M5 3l16 9-7 2 5 8-3 2-5-8-5 5z' fill='%230039A6' stroke='white' stroke-width='1.5'/></svg>") 5 3,auto}
a,button,input,select,label,.card,.chip{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28'><path d='M5 3l16 9-7 2 5 8-3 2-5-8-5 5z' fill='%230039A6' stroke='white' stroke-width='1.5'/></svg>") 5 3,pointer}
header{border-bottom:3px solid var(--blue);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--blue)}
.logo img{height:64px;width:auto;display:block}
header p{margin:0;color:var(--muted);font-size:.95rem}
main{max-width:1100px;margin:0 auto;padding:20px}
.controls{display:grid;gap:12px;margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=search],select,textarea,input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=search]{flex:1 1 260px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:.92rem}
.chip[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
button{font:inherit}
.btn{background:var(--blue);color:#fff;border:0;padding:9px 16px;border-radius:8px;font-weight:600}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.count{color:var(--muted);font-size:.92rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;background:#fff;color:var(--ink);width:100%}
.card h3{margin:0 0 2px;font-size:1.08rem}
.card .sub{color:var(--muted);font-size:.88rem;margin:0 0 8px}
.stars{color:var(--blue);letter-spacing:1px;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:var(--blue-soft);color:var(--blue-dark);font-size:.8rem;padding:2px 9px;border-radius:999px}
.card.selected,.is-blue{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}
.card.selected .sub,.card.selected .stars{color:#dbe6ff}
.card.selected .tag{background:#fff;color:var(--blue)}
.flash{animation:flash .45s ease-out}
@keyframes flash{0%{background:var(--blue);color:#fff}100%{}}
.ripple{position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--blue);pointer-events:none;opacity:.55;animation:rip .6s ease-out forwards;z-index:99}
@keyframes rip{to{transform:scale(4);opacity:0}}
@media (prefers-reduced-motion:reduce){.ripple,.flash{animation:none}}
#detail{margin-top:26px;border-top:3px solid var(--blue);padding-top:18px}
#detail[hidden]{display:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.fact{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fact b{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.notice{background:var(--blue-soft);border-left:4px solid var(--blue);padding:10px 14px;border-radius:6px;font-size:.92rem}
.review{border-bottom:1px solid var(--line);padding:12px 0}
.review.flagged{opacity:.6}
.review .meta{color:var(--muted);font-size:.85rem}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font-size:.85rem}
.link:active,.link.is-blue{color:#fff}
form.rev{display:grid;gap:10px;margin-top:14px;max-width:560px}
.rate{display:flex;gap:4px}
.rate button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--blue);font-size:1.1rem}
.rate button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--blue);color:#fff;font-weight:600}
td a{color:var(--blue)}
footer{max-width:1100px;margin:30px auto;padding:0 20px;color:var(--muted);font-size:.85rem}
</style>
</head>

  reviews:[{n:"Priya S.",r:5,t:"Study Commons has plenty of seats when upstairs is packed.",f:0},{n:"Jordan K.",r:4,t:"Great for group work, a bit loud by the entrance.",f:0}]},
 {id:3,name:"Library Study Rooms",where:"Library North and South",type:"Reservable rooms",wifi:1,outlets:1,quiet:0,groups:1,food:0,reserve:1,
  noise:"Closed rooms, good for talking",seating:"Small to large group rooms",hours:"Book up to 21 days ahead, 3 hours per day",
  blurb:"40+ rooms. Reserve with your campus ID. Reservations take priority over walk-ins.",
  reviews:[{n:"Alex M.",r:5,t:"Best place for group projects. Reserve ahead.",f:0}]},
 {id:4,name:"Aderhold Learning Center",where:"Fairlie-Poplar District",type:"Classroom building",wifi:1,outlets:1,quiet:0,groups:1,food:0,reserve:0,
  noise:"Moderate between classes",seating:"Hallway tables, computer lab",hours:"Check GSU building hours",
  blurb:"Classroom building with a ground-floor computer lab and spots to sit between classes.",
  reviews:[{n:"Chris L.",r:3,t:"Fine for a quick session, can get crowded between classes.",f:0}]},
 {id:5,name:"Student Center",where:"55 Gilmer St SE",type:"Student life",wifi:1,outlets:1,quiet:0,groups:1,food:1,reserve:0,
  noise:"Lively",seating:"Lounge seating and tables",hours:"Check GSU Student Center",
  blurb:"A busy hub with food, lounges, and tables. Better for casual group work than deep focus.",
  reviews:[{n:"Sam W.",r:4,t:"Great for meeting up and grabbing food between classes.",f:0}]},
 {id:6,name:"Starbucks and Saxbys on campus",where:"Around the library area",type:"Cafe",wifi:1,outlets:0,quiet:0,groups:1,food:1,reserve:0,
  noise:"Busy, background chatter",seating:"Cafe tables",hours:"Check each shop",
  blurb:"Coffee shops students use for studying. They get crowded at peak hours.",
  reviews:[{n:"Nia B.",r:4,t:"Good coffee, but outlets are hard to find.",f:0}]},
 {id:7,name:"Anatolia Cafe and Hookah Lounge",where:"Off campus, downtown Atlanta",type:"Off-campus cafe",wifi:1,outlets:0,quiet:0,groups:1,food:1,reserve:0,
  noise:"Relaxed",seating:"Lounge seating and tables",hours:"Check before going",
  blurb:"Recommended by GSU student writers as an alternative to the library.",
  reviews:[]}
];
const LIB="https://library.gsu.edu",SC="https://studentcenter.gsu.edu",MAPS="https://www.google.com/maps/search/";
const extra={
 1:{eats:"Saxbys coffee shop in the library. Check posted food rules by floor.",site:LIB},
 2:{eats:"Saxbys coffee shop in the library. Check posted food rules by floor.",site:LIB},
 3:{eats:"Check room rules before bringing food.",site:"https://rooms.library.gsu.edu/reserve/atlanta"},
 4:{eats:"Nothing confirmed inside. Downtown eateries are a short walk away.",site:"https://www.gsu.edu"},
 5:{eats:"Campus dining and a bookstore (Panther Dining). Check which spots are open.",site:SC},
 6:{eats:"Coffee, tea, and pastries.",site:"https://www.gsu.edu"},
 7:{eats:"Cafe drinks and food, plus hookah. Check the menu.",site:MAPS+encodeURIComponent("Anatolia Cafe Atlanta"),off:1}
};
spaces.forEach(s=>Object.assign(s,extra[s.id]||{}));
spaces.push(
 {id:8,name:"Café Lucia",where:"Downtown, near GSU",type:"Off-campus cafe",wifi:0,outlets:0,quiet:0,groups:1,food:1,reserve:0,offcampus:1,
  noise:"Laid-back, jazz in the background",seating:"Cafe tables",hours:"Not verified",eats:"Breakfast, coffee, and light meals.",
  blurb:"A cozy cafe students recommend for morning study sessions. Amenities are not verified.",site:MAPS+encodeURIComponent("Cafe Lucia Atlanta"),reviews:[]},
 {id:9,name:"Marlee’s Coffee & Tea House",where:"Past Grady Hospital",type:"Off-campus cafe",wifi:0,outlets:0,quiet:0,groups:1,food:1,reserve:0,offcampus:1,
  noise:"Not verified",seating:"Cafe tables",hours:"Not verified",eats:"Coffee and tea.",
  blurb:"A short walk from campus past Grady Hospital. Campus newspaper writers list it as a coffee stop. Amenities are not verified.",site:MAPS+encodeURIComponent("Marlee's Coffee and Tea House Atlanta"),reviews:[]},
 {id:10,name:"Atlanta-Fulton Central Library",where:"1 Margaret Mitchell Sq NW",type:"Public library",wifi:1,outlets:0,quiet:1,groups:0,food:0,reserve:0,offcampus:1,
  noise:"Quiet reading areas",seating:"Tables and reading rooms",hours:"Not verified",eats:"No cafe confirmed. Eat before you go.",
  blurb:"A free public library in downtown Atlanta that anyone can use. Wi-Fi and quiet are typical for public libraries but not verified here.",site:MAPS+encodeURIComponent("Atlanta-Fulton Central Library"),reviews:[]}
);
const state={filters:new Set(),sel:null,rating:0,admin:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const avg=sp=>{const r=sp.reviews.filter(x=>!x.removed);return r.length?r.reduce((a,b)=>a+b.r,0)/r.length:0};
const cnt=sp=>sp.reviews.filter(x=>!x.removed).length;
const stars=n=>"★".repeat(Math.round(n))+"☆".repeat(5-Math.round(n));
const labels={wifi:"Wi-Fi",outlets:"Outlets",quiet:"Quiet",groups:"Group-friendly",food:"Food nearby",reserve:"Reservable",offcampus:"Not GSU-owned"};

function render(){
  const q=$("#q").value.trim().toLowerCase(), s=$("#sort").value;
  let list=spaces.filter(sp=>{
    const hay=(sp.name+" "+sp.where+" "+sp.type+" "+sp.blurb+" "+sp.noise).toLowerCase();
    return hay.includes(q)&&[...state.filters].every(f=>sp[f]);
  });
  list.sort((a,b)=>s==="name"?a.name.localeCompare(b.name):s==="reviews"?cnt(b)-cnt(a):avg(b)-avg(a));
  $("#count").textContent=list.length+" of "+spaces.length+" spaces";
  $("#grid").innerHTML=list.length?list.map(sp=>`
    <button class="card${state.sel===sp.id?" selected":""}" data-id="${sp.id}">
      <h3>${esc(sp.name)}</h3>
      <p class="sub">${esc(sp.type)} · ${esc(sp.where)}</p>
      <span class="stars" aria-label="${avg(sp).toFixed(1)} out of 5">${stars(avg(sp))}</span>
      <span class="sub"> ${cnt(sp)?avg(sp).toFixed(1)+" ("+cnt(sp)+")":"No reviews yet"}</span>
      <div class="tags">${Object.keys(labels).filter(k=>sp[k]).map(k=>`<span class="tag">${labels[k]}</span>`).join("")}</div>
    </button>`).join(""):`<p>No spaces match. Clear a filter or change your search.</p>`;
}

function detail(){
  const sp=spaces.find(x=>x.id===state.sel), box=$("#detail");
  if(!sp){box.hidden=true;return}
  box.hidden=false;
  const revs=sp.reviews.filter(r=>!(r.removed));
  box.innerHTML=`
    <h2 style="margin:0;color:var(--blue)">${esc(sp.name)}</h2>
    <p class="sub" style="color:var(--muted);margin:2px 0 0">${esc(sp.type)} · ${esc(sp.where)}</p>
    <p>${esc(sp.blurb)}</p>
    <div class="facts">
      <div class="fact"><b>Noise</b>${esc(sp.noise)}</div>
      <div class="fact"><b>Seating</b>${esc(sp.seating)}</div>
      <div class="fact"><b>Hours / booking</b>${esc(sp.hours)}</div>
      <div class="fact"><b>Food and drinks</b>${esc(sp.eats||"Not listed")}</div>
      <div class="fact"><b>Closing time</b>Not verified. <a href="${sp.site||MAPS}" target="_blank" rel="noopener" style="color:var(--blue)">Check current hours</a></div>
      <div class="fact"><b>Owner</b>${sp.offcampus?"Not owned by GSU":"GSU"}</div>
      <div class="fact"><b>Rating</b><span class="stars">${stars(avg(sp))}</span> ${cnt(sp)?avg(sp).toFixed(1):"–"}</div>
    </div>
    ${sp.reserve?`<p class="notice">Need a room? <a href="https://rooms.library.gsu.edu/reserve/atlanta" style="color:var(--blue)">Reserve through GSU Library Rooms</a>. Active students can book up to 21 days ahead.</p>`:""}
    <div class="row" style="justify-content:space-between;margin-top:16px">
      <h3 style="margin:0">Reviews</h3>
      <label><input type="checkbox" id="admin" ${state.admin?"checked":""}> Admin mode</label>
    </div>
    ${revs.length?revs.map((r,i)=>`
      <div class="review${r.f?" flagged":""}">
        <div><span class="stars">${stars(r.r)}</span> <b>${esc(r.n)}</b></div>
        <div>${esc(r.t)}</div>
        <div class="meta">${r.f?"Flagged for review. ":""}
          ${state.admin?`<button class="link" data-act="remove" data-i="${sp.reviews.indexOf(r)}">Remove review</button>`
          :(r.f?"":`<button class="link" data-act="flag" data-i="${sp.reviews.indexOf(r)}">Report review</button>`)}
        </div>
      </div>`).join(""):`<p>No reviews yet. Be the first to add one.</p>`}
    <form class="rev" id="revform">
      <h3 style="margin:8px 0 0">Add your review</h3>
      <input type="text" id="rname" placeholder="Your name or initials" maxlength="30" required aria-label="Your name">
      <div class="rate" role="group" aria-label="Your rating">${[1,2,3,4,5].map(n=>`<button type="button" data-rate="${n}" aria-pressed="${state.rating>=n}">${state.rating>=n?"★":"☆"}</button>`).join("")}</div>
      <textarea id="rtext" rows="3" maxlength="400" placeholder="Wi-Fi, outlets, noise, seating? What should others know?" required aria-label="Review text"></textarea>
      <div><button class="btn" type="submit">Post review</button></div>
    </form>`;
}

function select(id){state.sel=state.sel===id?null:id;state.rating=0;render();detail();if(state.sel)$("#detail").scrollIntoView({behavior:"smooth",block:"start"})}

document.addEventListener("click",e=>{
  // blue ripple on every click
  const d=document.createElement("span");d.className="ripple";d.style.left=e.clientX+"px";d.style.top=e.clientY+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),650);
  // blue flash on whatever was clicked
  const t=e.target.closest("button,.card,.chip,a,label,select,input");
  if(t&&!t.classList.contains("card")){t.classList.remove("flash");void t.offsetWidth;t.classList.add("flash")}
  const card=e.target.closest(".card");if(card)return select(+card.dataset.id);
  const chip=e.target.closest(".chip");
  if(chip){const f=chip.dataset.f,on=chip.getAttribute("aria-pressed")!=="true";chip.setAttribute("aria-pressed",on);on?state.filters.add(f):state.filters.delete(f);return render()}
  const rate=e.target.closest("[data-rate]");if(rate){state.rating=+rate.dataset.rate;const nm=$("#rname").value,tx=$("#rtext").value;detail();$("#rname").value=nm;$("#rtext").value=tx;return}
  const act=e.target.closest("[data-act]");
  if(act){const sp=spaces.find(x=>x.id===state.sel),r=sp.reviews[+act.dataset.i];
    if(act.dataset.act==="flag")r.f=1;else r.removed=1;render();detail()}
});
document.addEventListener("change",e=>{if(e.target.id==="admin"){state.admin=e.target.checked;detail()}});
document.addEventListener("submit",e=>{
  if(e.target.id!=="revform")return;e.preventDefault();
  if(!state.rating){alert("Pick a star rating first.");return}
  const sp=spaces.find(x=>x.id===state.sel);
  sp.reviews.unshift({n:$("#rname").value.trim(),r:state.rating,t:$("#rtext").value.trim(),f:0});
  state.rating=0;render();detail();
});
$("#q").addEventListener("input",render);$("#sort").addEventListener("change",render);
function renderHours(){
  $("#hours").innerHTML=`<h2 style="color:var(--blue);margin:0 0 6px">When does everything close?</h2>
  <p class="notice">I couldn’t confirm current closing times for any of these places, and hours change by semester, holiday, and exam week. Use the link in each row for today’s hours before you go.</p>
  <div class="tw" style="margin-top:12px"><table><thead><tr><th>Place</th><th>Owner</th><th>Food and drinks</th><th>Closing time</th></tr></thead><tbody>`+
  spaces.map(s=>`<tr><td><b>${esc(s.name)}</b><br><span style="color:var(--muted)">${esc(s.where)}</span></td><td>${s.offcampus?"Not GSU":"GSU"}</td><td>${esc(s.eats||"Not listed")}</td><td>Not verified. <a href="${s.site||MAPS}" target="_blank" rel="noopener">Check hours</a></td></tr>`).join("")+
  `</tbody></table></div>`;
}
renderHours();
render();
</script>
</body>
</html>
