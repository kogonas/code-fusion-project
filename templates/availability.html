{% extends "base.html" %}{% block content %}
<h1>Weekly availability</h1><form method="post" class="mb-4">
<label class="form-label" for="day">Day</label><select class="form-select mb-3" id="day" name="day">{% for day in days %}<option>{{ day }}</option>{% endfor %}</select>
<label class="form-label" for="start_time">From</label><input class="form-control mb-3" id="start_time" name="start_time" type="time" required>
<label class="form-label" for="end_time">To</label><input class="form-control mb-3" id="end_time" name="end_time" type="time" required>
<button class="btn btn-primary">Add time</button></form>
<ul class="list-group mb-3">{% for slot in slots %}<li class="list-group-item d-flex justify-content-between align-items-center">{{ slot.day }}: {{ slot.start_time }} – {{ slot.end_time }}<form method="post" action="{{ url_for('delete_availability', slot_id=slot.id) }}"><button class="btn btn-sm btn-outline-danger">Remove</button></form></li>{% else %}<li class="list-group-item">No times added yet.</li>{% endfor %}</ul>
<a href="{{ url_for('dashboard') }}">Back to dashboard</a>{% endblock %}
