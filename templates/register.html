{% extends "base.html" %}{% block content %}<h1>Create Account</h1>
<form method="post"><label class="form-label">Name</label><input class="form-control mb-3" name="name" required maxlength="120">
<label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" required>
<label class="form-label">Password (8+ characters)</label><input class="form-control mb-3" name="password" type="password" minlength="8" required>
<button class="btn btn-primary">Register</button></form><p class="mt-3"><a href="{{ url_for('login') }}">Already have an account? Log in</a></p>{% endblock %}
