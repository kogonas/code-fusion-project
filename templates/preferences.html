{% extends "base.html" %}{% block content %}
<h1>Study preferences</h1><form method="post">
{% for field, label, options in [('study_style','Study style',styles), ('meeting_type','Meeting type',meetings), ('group_size','Preferred group size',sizes)] %}
<label class="form-label" for="{{ field }}">{{ label }}</label><select class="form-select mb-3" id="{{ field }}" name="{{ field }}" required>{% for option in options %}<option value="{{ option }}" {% if saved.get(field) == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select>
{% endfor %}<button class="btn btn-primary">Save preferences</button> <a class="btn btn-link" href="{{ url_for('dashboard') }}">Back</a></form>
{% endblock %}
