{% extends "base.html" %}{% block content %}<h1>Log In</h1>
<form method="post"><label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" required>
<label class="form-label">Password</label><input class="form-control mb-3" name="password" type="password" required>
<button class="btn btn-primary">Log in</button></form><p class="mt-3"><a href="{{ url_for('register') }}">Create an account</a></p>{% endblock %}
