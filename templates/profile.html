{% extends "base.html" %}{% block content %}
<h1>Edit profile</h1><form method="post">
<label class="form-label" for="name">Name</label><input class="form-control mb-3" id="name" name="name" maxlength="120" required value="{{ user.name }}">
<label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" name="email" type="email" maxlength="255" required value="{{ user.email }}">
<button class="btn btn-primary">Save profile</button> <a class="btn btn-link" href="{{ url_for('dashboard') }}">Back</a>
</form>{% endblock %}
